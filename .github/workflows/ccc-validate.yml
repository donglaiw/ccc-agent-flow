name: CCC Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bundled CCC examples
        run: |
          bash -n scripts/ccc-detect-session.sh
          bash -n scripts/ccc-validate.sh
          bash -n scripts/ccc-check-agent-cli.sh
          scripts/ccc-validate.sh examples/runs/hello-world
          scripts/ccc-validate.sh examples/runs/hello-world-codex-session
          scripts/ccc-validate.sh examples/runs/hello-world-auto-override
